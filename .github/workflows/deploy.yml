name: CI/CD Pipeline - Smart Campus Platform

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-backend:
    name:  Deploy Backend 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambda Function (manylinux)
        run: |
          cd backend
          rm -rf dist lambda_function.zip
          mkdir dist
          # Cài đặt thư viện bản Linux tương thích với môi trường AWS Lambda
          pip install --platform manylinux2014_x86_64 -t ./dist --implementation cp --python-version 3.12 --only-binary=:all: --upgrade -r requirements.txt
          cp -r app dist/
          cd dist
          zip -r9 ../lambda_function.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name smart-campus-api \
            --zip-file fileb://backend/lambda_function.zip

  deploy-frontend:
    name:  Deploy Frontend 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build React Vite
        env:
          VITE_API_URL: https://kxde947a40.execute-api.ap-southeast-1.amazonaws.com/api
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync to Amazon S3
        run: |
          aws s3 sync frontend/dist/ s3://smart-campus-frontend-730355530327-ap-southeast-1-an/dist/ --delete --region ap-southeast-1

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  create-release:
    name:  GitHub Release
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name:  GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }} - Smart Campus Platform"
          body: |
            ## 🚀 Smart Campus Platform - Automated Production Release

            ### 📋 Deployment Summary
            - **Build Number:** `#${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Triggered By:** `@${{ github.actor }}`
            - **Region:** `ap-southeast-1` (Singapore)

            ### 📦 Services Updated
            - ✅ **AWS Lambda:** `smart-campus-api` updated with latest manylinux packages.
            - ✅ **Amazon S3 & CloudFront:** Frontend assets synced to `smart-campus-frontend-730355530327-ap-southeast-1-an` and cache invalidated.
            - ✅ **WAF IP Set:** Integrated with `SmartCampusIPSet`.

            ---
            *Automated Release generated by GitHub Actions CI/CD Pipeline.*
          draft: false
          prerelease: false


